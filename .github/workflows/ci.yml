name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10
      # The dev group alone holds ruff at the locked version, without torch.
      - run: uv run --locked --only-group dev ruff format --check .
      - run: uv run --locked --only-group dev ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # torch and its CUDA wheels fill most of the runner's disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
