name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # ruff alone, at the version requirements.txt pins, without torch.
      - run: pip install "$(grep '^ruff==' requirements.txt)"
      - run: ruff format --check .
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # torch and its CUDA wheels fill most of the runner's disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # Colab's Python, so the suite runs on the versions the experiment runs on.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      # torch's pin names its CUDA build, which PyTorch's index serves, not PyPI.
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cu130
      - run: pytest -q
