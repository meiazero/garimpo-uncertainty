[project]
name = "garimpo-uncertainty"
version = "0.1.0"
description = "Calibrated prediction intervals for artisanal mining area from Sentinel-2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "compass",
    "geopandas>=1.0",
    "lightgbm>=4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.0",
    "pyogrio>=0.9",
    "rasterio>=1.5.2",
    "scikit-learn>=1.3",
    "safetensors>=0.4",
    "scipy>=1.13",
    # models.split_at mirrors this release's UnetDecoder.forward.
    "segmentation-models-pytorch==0.6.0",
    "shapely>=2.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",  # required by segmentation-models-pytorch; here so the cu126 index applies
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# The PyPI torch wheel targets CUDA 13; the CENAPAD A100 driver needs the cu126 build.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
compass = { path = "compass", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garimpo_uncertainty"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear
